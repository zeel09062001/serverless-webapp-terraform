name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.16.1"
  TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_report_sender_email: ${{ vars.REPORT_SENDER_EMAIL }}

jobs:
  # ===========================================================================
  # CHECKS: run on every pull request and every merge, with NO AWS access
  # ===========================================================================

  # Python unit tests, against a fake AWS (moto)
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read # can't obtain AWS credentials
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Python 3.12 (same as Lambda)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  # Terraform module tests, with a mocked AWS provider
  module-tests:
    name: Module tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [database, auth, receipts]
    defaults:
      run:
        working-directory: modules/${{ matrix.module }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -input=false

      - name: Test
        run: terraform test

  # Security scan: ENFORCED. Any new finding fails the pipeline,
  # unless it's fixed or accepted with a written reason.
  security-scan:
    name: Security scan (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install "checkov>=3,<4"

      - name: Scan Terraform
        run: checkov -d . --config-file .checkov.yaml

  # ===========================================================================
  # PULL REQUESTS: plan both environments, after all checks pass
  # ===========================================================================
  plan:
    name: Plan (${{ matrix.environment }})
    needs: [test, module-tests, security-scan]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    concurrency:
      group: terraform-${{ matrix.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: envs/${{ matrix.environment }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Create provider cache folder
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Restore provider cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-

      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: .

      - name: Init
        run: terraform init -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false

  # ===========================================================================
  # MERGE TO MAIN: deploy dev automatically, after all checks pass...
  # ===========================================================================
  apply-dev:
    name: Apply (dev)
    needs: [test, module-tests, security-scan]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: terraform-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Create provider cache folder
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Restore provider cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-

      - name: Init
        run: terraform init -input=false -lockfile=readonly

      - name: Apply
        run: terraform apply -auto-approve -input=false

      - name: Show outputs
        run: terraform output

  # ===========================================================================
  # ...then wait for approval, and deploy THE SAME COMMIT to prod
  # ===========================================================================
  apply-prod:
    name: Apply (prod)
    needs: apply-dev
    runs-on: ubuntu-latest
    environment: prod # required reviewers + main branch only
    concurrency:
      group: terraform-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: envs/prod
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Create provider cache folder
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Restore provider cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-

      - name: Init
        run: terraform init -input=false -lockfile=readonly

      - name: Apply
        run: terraform apply -auto-approve -input=false

      - name: Show outputs
        run: terraform output