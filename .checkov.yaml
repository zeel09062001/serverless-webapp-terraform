# =============================================================================
# Checkov configuration
#
# Rules under skip-check don't fit this ARCHITECTURE as a whole, so they're
# skipped everywhere, each with its reason and what would change the decision.
# Exceptions for ONE resource are written next to that resource instead,
# as  #checkov:skip=<rule>:<reason>
# =============================================================================
framework:
  - terraform
skip-path:
  - .venv
quiet: true
compact: true

skip-check:
  # Lambda in a VPC: our Lambdas only call AWS service APIs, secured by IAM.
  # A VPC would add NAT Gateway or VPC endpoint cost, with no benefit.
  # Revisit if we add resources that live in a VPC (e.g. RDS).
  - CKV_AWS_117

  # CMK for Lambda env vars: already encrypted at rest; ours hold no secrets,
  # only resource names. Secrets would go to Secrets Manager instead.
  - CKV_AWS_173

  # CMK for log groups: CloudWatch Logs already encrypts at rest.
  # Revisit if compliance requires customer-controlled keys.
  - CKV_AWS_158

  # CMK for DynamoDB: already encrypted at rest with an AWS-owned key.
  # Can be switched later without replacing the table.
  - CKV_AWS_119

  # CMK for the scheduler: its only data is the scheduled-time placeholder.
  - CKV_AWS_297

  # 1-year log retention: we keep 14 days ON PURPOSE. Logs contain IP
  # addresses and user IDs (data minimization), and it keeps costs low.
  - CKV_AWS_338

  # Lambda code signing: code only reaches AWS through the pipeline from
  # reviewed commits. Revisit with build-once artifact deployments.
  - CKV_AWS_272

  # Function DLQs only apply to async invocations. The API is synchronous;
  # the worker uses its SQS queue's DLQ; the report Lambda uses an
  # on-failure destination (the newer equivalent, not recognized by this rule).
  - CKV_AWS_116

  # Geo restriction: the app has no legal limits on where it may be used.
  - CKV_AWS_374

    # S3 encrypted with KMS: all buckets already use SSE-S3 encryption at rest.
  # Same customer-managed-key decision as DynamoDB and logs.
  - CKV_AWS_145

  # Cross-region replication: a region-wide outage is accepted as out of
  # scope in the DR plan; replication would double storage cost.
  - CKV_AWS_144

  # S3 server access logging: needs a separate log bucket and adds cost.
  # API activity is in the API access logs. Revisit with CloudTrail data events.
  - CKV_AWS_18

  # S3 event notifications: only the receipts bucket needs one, and it HAS
  # one (defined in modules/receipt_processing, which this rule can't see).
  - CKV2_AWS_62