name: Debug OIDC

on:
  push:
    branches-ignore: [main]

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Show which role the workflow will use
        run: |
          echo "AWS_ROLE_ARN = [${{ vars.AWS_ROLE_ARN }}]"
          echo "AWS_REGION   = [${{ vars.AWS_REGION }}]"

      - name: Show what GitHub's token says about us
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, repository, repository_owner}'
