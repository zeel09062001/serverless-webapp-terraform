name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VAR_report_sender_email: ${{ vars.REPORT_SENDER_EMAIL }}
  TF_VERSION: "1.16.1"
  TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  
jobs:
  plan:
    name: Plan (dev)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Create provider cache folder
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Restore provider cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-

      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: .

      - name: Init
        run: terraform init -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false

  apply:
    name: Apply (dev)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Create provider cache folder
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Restore provider cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-

      - name: Init
        run: terraform init -input=false -lockfile=readonly

      - name: Apply
        run: terraform apply -auto-approve -input=false

      - name: Show outputs
        run: terraform output
